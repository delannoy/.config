
# https://www.man7.org/linux/man-pages/man1/tmux.1.html#OPTIONS

# server options:
# set-option -s set-clipboard on # Attempt to set the terminal clipboard content using the xterm(1) escape sequence.
set-option -s default-terminal 'xterm-256color' # Set the default terminal for new windows created in this session - the default value of the TERM environment variable.
set-option -s escape-time 10 # Set the time in milliseconds for which tmux waits after an escape is input to determine if it is part of a function or meta key sequences.
# set-option -s extended-keys on # Controls how modified keys (keys pressed together with Control, Meta, or Shift) are reported.
set-option -s focus-events on # When enabled, focus events are requested from the terminal if supported and passed through to applications running in tmux.
# set-option -s history-file ~/.config/tmux/history # If not empty, a file to which tmux will write command prompt history on exit and load it from on start.
# set-option -sa terminal-features ',xterm-256color:RGB' # Set terminal features for terminal types read from terminfo(5).

# global options:
set-option -g base-index 1 # Set the base index from which an unused index should be searched when a new window is created.
# set-option -g default-command "/usr/bin/env sh" # Set the command used for new windows (if not specified when the window is created) to shell-command, which may be any sh(1) command.
set-option -g history-limit 10000 # Set the maximum number of lines held in pane history.
set-option -g mouse off # If on, tmux captures the mouse and allows mouse events to be bound as key bindings.
set-option -g prefix C-Space # Set the key accepted as a prefix key.
set-option -g renumber-windows on # If on, when a window is closed in a session, automatically renumber the other windows in numerical order.  This respects the base-index option if it has been set.

# status bar options:
set-option -g status on # Show or hide the status line or specify its size.
set-option -g status-interval 600 # Update the status line every interval seconds.
set-option -g status-justify 'centre' # Set the position of the window list in the status line: left, centre or right.
set-option -g status-left '#{?client_prefix,#[bold]#{session_name}#[default],#[dim]#{session_name}#[default]}' # Display string (by default the session name) to the left of the status line.
set-option -g status-left-length 50 # Set the maximum length of the left component of the status line.
set-option -g status-position 'bottom' # Set the position of the status line.
set-option -g status-right '#[dim]#{host}#[default]' # Display string to the right of the status line. 
# set-option -g status-right '#[dim]#{host}#[default]#(aklog)' # [Run command in tmux and update the status bar](https://stackoverflow.com/a/79744620/13019084)
set-option -g window-status-current-format '#[bold] #I:#W #[default]' # Like window-status-format, but is the format used when the window is the current window.
set-option -g window-status-format '#[dim] #I:#W #[default]' # Set the format in which the window is displayed in the status line window list.
set-option -g status-style 'bg=default,fg=default' # Set status line style.

# window options:
set-window-option -g mode-keys 'vi' # Use vi or emacs-style key bindings in copy mode.
set-window-option -g pane-base-index 1 # Like base-index, but set the starting index for pane numbers.

# keybinds:
bind h select-pane -L # Make pane target-pane the active pane in its window. If one of -D, -L, -R, or -U is used, respectively the pane below, to the left, to the right, or above the target pane is used.
bind j select-pane -D # Make pane target-pane the active pane in its window. If one of -D, -L, -R, or -U is used, respectively the pane below, to the left, to the right, or above the target pane is used.
bind k select-pane -U # Make pane target-pane the active pane in its window. If one of -D, -L, -R, or -U is used, respectively the pane below, to the left, to the right, or above the target pane is used.
bind l select-pane -R # Make pane target-pane the active pane in its window. If one of -D, -L, -R, or -U is used, respectively the pane below, to the left, to the right, or above the target pane is used.
bind ] next-window # Move to the next window in the session
bind [ previous-window # Move to the previous window in the session
bind R source-file "${XDG_CONFIG_HOME}/tmux/tmux.conf" # Move to the next window in the session
# bind | split-window -h # Create a new pane by splitting target-pane (-h does a horizontal split)
# bind - split-window -v # Create a new pane by splitting target-pane (-v does a vertical split)
